server:
  port: 9107
notification:
  websocket:
    allowed-origins: ${NOTIFICATION_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173,http://127.0.0.1:5173}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
spring:
  profiles:
    include: notification-mq
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:mysql://127.0.0.1:9095/notification_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${NOTIFICATION_DB_USERNAME:notification_service}
    password: ${NOTIFICATION_DB_PASSWORD:notification_password_dev_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # DATETIME 统一采用 UTC+8；JDBC serverTimezone 不会设置 MySQL 会话时区。
      connection-init-sqls:
        - "SET SESSION time_zone = '+08:00'"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:9096}
      password: ${REDIS_PASSWORD:order_redis_dev_2026}
      database: 0
      connect-timeout: 2s
      timeout: 2s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:9097}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:root}
security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:9094}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:/home/user/.config/order-system/keys/jwt-public.pem}
    blacklist-key-prefix: ${JWT_BLACKLIST_KEY_PREFIX:auth:access-token:blacklist:}
internal:
  scope:
    token: ${INTERNAL_SCOPE_TOKEN:internal_scope_token_dev_2026}
