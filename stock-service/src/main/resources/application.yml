server:
  # 库存服务本机端口。
  port: 9104

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 本机开发容量：每个实例独立持有连接池，扩容时需合计 MySQL 连接数。
      initial-size: 1
      min-idle: 1
      max-active: 10
      max-wait: 3000
      validation-query: SELECT 1
      validation-query-timeout: 2
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
    # 库存服务只连接自己的数据库。
    url: ${STOCK_DB_URL:jdbc:mysql://127.0.0.1:9095/stock_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${STOCK_DB_USERNAME:stock_service}
    password: ${STOCK_DB_PASSWORD:stock_password_dev_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      # 库存预扣快照与 JWT 注销状态共用同一 Redis。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:9096}
      password: ${REDIS_PASSWORD:order_redis_dev_2026}
      database: 0
      connect-timeout: 2s
      timeout: 2s

  application:
    name: stock-service

  cloud:
    nacos:
      discovery:
        # 本机运行时连接 Docker 暴露的 Nacos API 端口。
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:9097}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:root}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:9094}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:/home/user/.config/order-system/keys/jwt-public.pem}
    blacklist-key-prefix: ${JWT_BLACKLIST_KEY_PREFIX:auth:access-token:blacklist:}

internal:
  scope:
    # 服务间内部接口共享密钥，与 order-service / product-service 保持一致。
    token: ${INTERNAL_SCOPE_TOKEN:internal_scope_token_dev_2026}

seata:
  # 库存扣减作为下单全局事务的本地分支（RM）。
  enabled: true
  application-id: stock-service
  # 事务分组名必须与 order-service（TM）保持一致，二者才能落到同一个 TC 集群。
  tx-service-group: ${SEATA_TX_SERVICE_GROUP:order-system-tx-group}
  service:
    # 事务分组到 TC 集群的映射，集群名与 seata-server 侧 cluster 配置一致。
    vgroup-mapping:
      order-system-tx-group: default
    # 本机开发直连 TC：TC 跑在 WSL 的 Docker 里，只能用容器内网 IP 注册到 Nacos，
    # 而 WSL2 NAT 下 Windows 宿主机没有到该网段的路由（流量还会被本机代理软件的 TUN
    # 接管成假连接），因此不做注册中心发现，直接使用 Docker 映射到宿主机的 9109 端口。
    # 容器化部署（服务与 seata-server 同处一个 Docker 网络）时，
    # 应改回 seata.registry.type=nacos 并补回 nacos 段，或把本项改写成容器内可达地址。
    grouplist:
      default: ${SEATA_TC_GROUPLIST:127.0.0.1:9109}
  registry:
    # file 表示地址来自本地配置（上面的 grouplist），不查注册中心。
    type: file
  config:
    # 客户端不引入配置中心，事务参数使用 starter 默认值。
    type: file

stock:
  snapshot:
    # Redis 库存快照 Key 前缀，按 (档口, 菜品) 定位。
    key-prefix: ${STOCK_SNAPSHOT_KEY_PREFIX:stock:available:}
    # 快照过期秒数：过期后回源数据库重新加载，
    # 使「Redis 预扣与数据库」的短期漂移能自动收敛，Redis 不作为事实来源。
    ttl-seconds: ${STOCK_SNAPSHOT_TTL_SECONDS:300}
  reconcile:
    # 库存对账定时任务开关，便于本地按需关闭。
    enabled: ${STOCK_RECONCILE_ENABLED:true}

# 接口文档：本地默认开启，生产环境可通过 SWAGGER_ENABLED=false 关闭。
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  service-title: 库存服务接口文档
  service-description: 仅供服务间调用的库存扣减、回补与查询接口。
  gateway-base-url: ${SWAGGER_GATEWAY_BASE_URL:http://localhost:9090}
  gateway-path: /api
