spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 接口文档专用路由：必须排在对应服务的 /api/xxx/** 路由之前，
            # Spring Cloud Gateway 首个匹配生效。此处用 RewritePath 而非
            # StripPrefix=1，否则会落到不存在的 /xxx/v3/api-docs 路径。
            - id: auth-service-docs
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/v3/api-docs
              filters:
                - RewritePath=/api/auth/v3/api-docs, /v3/api-docs

            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/api/users/v3/api-docs
              filters:
                - RewritePath=/api/users/v3/api-docs, /v3/api-docs

            - id: order-service-docs
              uri: lb://order-service
              predicates:
                - Path=/api/orders/v3/api-docs
              filters:
                - RewritePath=/api/orders/v3/api-docs, /v3/api-docs

            - id: product-service-docs
              uri: lb://product-service
              predicates:
                - Path=/api/products/v3/api-docs
              filters:
                - RewritePath=/api/products/v3/api-docs, /v3/api-docs

            - id: payment-service-docs
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/v3/api-docs
              filters:
                - RewritePath=/api/payments/v3/api-docs, /v3/api-docs

            - id: file-service-docs
              uri: lb://file-service
              predicates:
                - Path=/api/files/v3/api-docs
              filters:
                - RewritePath=/api/files/v3/api-docs, /v3/api-docs

            - id: cart-service-docs
              uri: lb://cart-service
              predicates:
                - Path=/api/cart/v3/api-docs
              filters:
                - RewritePath=/api/cart/v3/api-docs, /v3/api-docs

            - id: comment-service-docs
              uri: lb://comment-service
              predicates:
                - Path=/api/comments/v3/api-docs
              filters:
                - RewritePath=/api/comments/v3/api-docs, /v3/api-docs

            - id: search-service-docs
              uri: lb://search-service
              predicates:
                - Path=/api/search/v3/api-docs
              filters:
                - RewritePath=/api/search/v3/api-docs, /v3/api-docs

            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/search,/api/search/**
              filters:
                - StripPrefix=1

            - id: comment-service
              uri: lb://comment-service
              predicates:
                - Path=/api/comments,/api/comments/**
              filters:
                - StripPrefix=1

            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/cart,/api/cart/**
              filters:
                - StripPrefix=1

            # 库存服务只注册「文档路由」：它当前对外只有 /internal/stocks/**
            # 三个内部接口（由 order-service 直连调用并校验 X-Internal-Token），
            # 按项目约定 /internal/** 不进网关，因此这里不配 /api/stocks/** 业务路由。
            - id: stock-service-docs
              uri: lb://stock-service
              predicates:
                - Path=/api/stocks/v3/api-docs
              filters:
                - RewritePath=/api/stocks/v3/api-docs, /v3/api-docs

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1

            - id: file-service
              uri: lb://file-service
              predicates:
                - Path=/api/files/**
              filters:
                - StripPrefix=1
