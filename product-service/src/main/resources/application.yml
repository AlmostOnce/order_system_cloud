server:
  # 商品服务本机端口。
  port: 8086

spring:
  datasource:
    # 商品服务只连接自己的数据库。
    url: ${PRODUCT_DB_URL:jdbc:mysql://127.0.0.1:3307/product_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${PRODUCT_DB_USERNAME:product_service}
    password: ${PRODUCT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      # JWT 注销状态与其他服务共用 Redis 黑名单。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      connect-timeout: 2s
      timeout: 2s

  application:
    name: product-service

  cloud:
    nacos:
      discovery:
        # 本机运行时连接 Docker 暴露的 Nacos API 端口。
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8850}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8084}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:/home/user/.config/order-system/keys/jwt-public.pem}
    blacklist-key-prefix: ${JWT_BLACKLIST_KEY_PREFIX:auth:access-token:blacklist:}
