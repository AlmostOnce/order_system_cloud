server:
  # 商品服务本机端口。
  port: 9093

spring:
  profiles:
    include: search-mq
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 本机开发容量：每个实例独立持有连接池，扩容时需合计 MySQL 连接数。
      initial-size: 1
      min-idle: 1
      max-active: 10
      max-wait: 3000
      validation-query: SELECT 1
      validation-query-timeout: 2
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
    # 商品服务只连接自己的数据库。
    url: ${PRODUCT_DB_URL:jdbc:mysql://127.0.0.1:9095/product_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${PRODUCT_DB_USERNAME:product_service}
    password: ${PRODUCT_DB_PASSWORD:product_password_dev_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      # JWT 注销状态与其他服务共用 Redis 黑名单。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:9096}
      password: ${REDIS_PASSWORD:order_redis_dev_2026}
      database: 0
      connect-timeout: 2s
      timeout: 2s

  application:
    name: product-service

  cloud:
    sentinel:
      # 开启 Sentinel，并在启动时立即初始化。
      enabled: true
      eager: true
      transport:
        # Sentinel Dashboard 地址，与 order-service 共用同一控制台。
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:9099}

        # 本服务与 Dashboard 通信端口，避开 order-service 的 9100 与文件服务的 HTTP 端口 9102。
        port: ${SENTINEL_TRANSPORT_PORT:9110}
      datasource:
        degrade:
          nacos:
            # Nacos API 地址。
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:9097}

            # Nacos 登录账号。
            username: ${NACOS_USERNAME:nacos}

            # Nacos 登录密码。
            password: ${NACOS_PASSWORD:root}

            # Nacos 配置 Data ID。
            data-id: product-service-degrade-rules

            # Nacos 配置分组。
            group-id: SENTINEL_GROUP

            # 规则格式。
            data-type: json

            # 规则类型。
            rule-type: degrade

    nacos:
      discovery:
        # 本机运行时连接 Docker 暴露的 Nacos API 端口。
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:9097}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:root}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:9094}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:/home/user/.config/order-system/keys/jwt-public.pem}
    blacklist-key-prefix: ${JWT_BLACKLIST_KEY_PREFIX:auth:access-token:blacklist:}

internal:
  scope:
    # 数据范围相关内部接口的共享密钥，与 user-service / order-service 保持一致。
    token: ${INTERNAL_SCOPE_TOKEN:internal_scope_token_dev_2026}

# 接口文档：本地默认开启，生产环境可通过 SWAGGER_ENABLED=false 关闭。
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  service-title: 商品服务接口文档
  service-description: 餐厅、档口、商品与核价接口。
  # 网关地址与路径前缀，用于修正经网关聚合后 "Try it out" 的目标地址。
  # 网关路由 StripPrefix=1 只剥离 /api 一段，故前缀固定为 /api，与各服务自身路径拼接。
  gateway-base-url: ${SWAGGER_GATEWAY_BASE_URL:http://localhost:9090}
  gateway-path: /api
