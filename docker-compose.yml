name: order-system-cloud

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "9095:3306"
    volumes:
      - order-system-cloud-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 12
  nacos:
    image: nacos/nacos-server:v3.0.3
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
    ports:
      - "9098:8080"
      - "9097:8848"
      - "10097:9848"
      - "10098:9849"
    volumes:
      - order-system-cloud-nacos-data:/home/nacos/data
      - order-system-cloud-nacos-logs:/home/nacos/logs

  mongo:
    profiles: [comment]
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-comment_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      COMMENT_MONGO_USERNAME: ${COMMENT_MONGO_USERNAME:-comment_service}
      COMMENT_MONGO_PASSWORD: ${COMMENT_MONGO_PASSWORD:-}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - order-system-cloud-mongo-data:/data/db
      - ./docker/mongo/01-comment-init.js:/docker-entrypoint-initdb.d/01-comment-init.js:ro

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "9096:6379"
    volumes:
      - order-system-cloud-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    profiles: [search]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - order-system-cloud-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  seata:
    image: apache/seata-server:2.5.0
    restart: unless-stopped
    environment:
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      # 全局会话 file 存储目录与日志目录均落在挂载卷中，重启不丢。
      LOG_HOME: /seata-server/logs
    # 注意：本镜像对 TC 注册到 Nacos 的地址无法通过 SEATA_IP 覆盖（实测仍注册容器内网 IP，
    # 如 172.19.0.3）。而本机开发时 TM/RM 跑在 Windows 宿主机上，WSL2 NAT 下宿主机没有到
    # 容器网段的路由（该网段还会被本机代理软件的 TUN 接管，表现成 198.18.x.x 的假连接），
    # 因此 order-service / stock-service 的 Seata 客户端不使用 Nacos 注册中心，
    # 改为直连宿主机 127.0.0.1:9109，见两个服务 application.yml 的 seata.registry/service 配置。
    # TC 注册到 Nacos 使用的配置中心地址为容器网络内的 nacos:8848，见 docker/seata/application.yml。
    volumes:
      - ./docker/seata/application.yml:/seata-server/resources/application.yml:ro
      - order-system-cloud-seata-data:/seata-server/sessionStore
      - order-system-cloud-seata-logs:/seata-server/logs
    depends_on:
      nacos:
        condition: service_started
    ports:
      # 容器内 TC 监听 9109，与宿主机 1:1 映射，
      # 供宿主机侧 Seata 客户端按 127.0.0.1:9109 直连；7091 为控制台端口。
      - "9109:9109"
      - "9108:7091"

  rocketmq-permissions:
    profiles: [mq]
    image: apache/rocketmq:5.3.2
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - chown -R 3000:3000 /mq-namesrv-logs /mq-broker-logs /mq-store
    volumes:
      - order-system-cloud-rocketmq-namesrv-logs:/mq-namesrv-logs
      - order-system-cloud-rocketmq-broker-logs:/mq-broker-logs
      - order-system-cloud-rocketmq-store:/mq-store

  rocketmq-namesrv:
    profiles: [mq]
    image: apache/rocketmq:5.3.2
    restart: unless-stopped
    command: sh mqnamesrv
    depends_on:
      rocketmq-permissions:
        condition: service_completed_successfully
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    ports:
      - "9876:9876"
    volumes:
      - order-system-cloud-rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    profiles: [mq]
    image: apache/rocketmq:5.3.2
    restart: unless-stopped
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=128m"
    depends_on:
      rocketmq-permissions:
        condition: service_completed_successfully
      rocketmq-namesrv:
        condition: service_started
    ports:
      - "10911:10911"
      - "10909:10909"
      - "10912:10912"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - order-system-cloud-rocketmq-store:/home/rocketmq/store
      - order-system-cloud-rocketmq-broker-logs:/home/rocketmq/logs

  rocketmq-init:
    profiles: [mq]
    image: apache/rocketmq:5.3.2
    depends_on:
      rocketmq-broker:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in order-paid-sales-v1 product-rating-changed-v1 stock-changed-v1 product-search-refresh-v1 order-status-notification-v1; do
          attempts=0
          while true; do
            result=$$(sh /home/rocketmq/rocketmq-5.3.2/bin/mqadmin updateTopic -n rocketmq-namesrv:9876 -b rocketmq-broker:10911 -t "$$topic" -r 4 -w 4 2>&1)
            printf '%s\n' "$$result"
            case "$$result" in
              *"create topic to "*" success."*) break ;;
            esac
            attempts=$$((attempts + 1))
            if [ "$$attempts" -ge 30 ]; then exit 1; fi
            sleep 3
          done
        done

  gateway:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "9090:9090"

volumes:
  order-system-cloud-mysql-data:
  order-system-cloud-mongo-data:
  order-system-cloud-nacos-data:
  order-system-cloud-nacos-logs:
  order-system-cloud-redis-data:
  order-system-cloud-seata-data:
  order-system-cloud-seata-logs:
  order-system-cloud-rocketmq-namesrv-logs:
  order-system-cloud-rocketmq-store:
  order-system-cloud-rocketmq-broker-logs:
  order-system-cloud-elasticsearch-data:
