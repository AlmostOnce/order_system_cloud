name: order-system-cloud

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "9095:3306"
    volumes:
      - order-system-cloud-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 12
  nacos:
    image: nacos/nacos-server:v3.0.3
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
    ports:
      - "9098:8080"
      - "9097:8848"
      - "10097:9848"
      - "10098:9849"
    volumes:
      - order-system-cloud-nacos-data:/home/nacos/data
      - order-system-cloud-nacos-logs:/home/nacos/logs

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "9096:6379"
    volumes:
      - order-system-cloud-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seata:
    image: apache/seata-server:2.5.0
    restart: unless-stopped
    environment:
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      # 全局会话 file 存储目录与日志目录均落在挂载卷中，重启不丢。
      LOG_HOME: /seata-server/logs
    # TC 注册到 Nacos 使用的地址为容器网络内的 nacos:8848，见 docker/seata/application.yml。
    volumes:
      - ./docker/seata/application.yml:/seata-server/resources/application.yml:ro
      - order-system-cloud-seata-data:/seata-server/sessionStore
      - order-system-cloud-seata-logs:/seata-server/logs
    depends_on:
      nacos:
        condition: service_started
    ports:
      # 容器内 TC 监听 9109，与宿主机 1:1 映射，便于直接 telnet 检查；
      # 7091 为控制台端口。客户端经 Nacos 拿到的是容器地址 172.x:9109，已验证宿主机可达。
      - "9109:9109"
      - "9108:7091"

  gateway:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "9090:9090"

volumes:
  order-system-cloud-mysql-data:
  order-system-cloud-nacos-data:
  order-system-cloud-nacos-logs:
  order-system-cloud-redis-data:
  order-system-cloud-seata-data:
  order-system-cloud-seata-logs:
