server:
  # 用户服务端口。
  port: 9092

spring:
  datasource:
    # 用户服务只连接自己的数据库。
    url: ${USER_DB_URL:jdbc:mysql://127.0.0.1:9095/user_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${USER_DB_USERNAME:user_service}
    password: ${USER_DB_PASSWORD:user_password_dev_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    # 注册到 Nacos 的服务名称。
    name: user-service

  data:
    redis:
      # JWT 注销状态与其他服务共用 Redis 黑名单，并缓存数据范围查询结果。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:9096}
      password: ${REDIS_PASSWORD:order_redis_dev_2026}
      database: 0
      connect-timeout: 2s
      timeout: 2s

  cloud:
    nacos:
      discovery:
        # 本项目 Nacos 服务地址。
        server-addr: 127.0.0.1:9097

        # Nacos 登录账号。
        username: nacos

        # Nacos 登录密码。
        password: root

management:
  endpoints:
    web:
      # 暴露健康检查接口。
      exposure:
        include: health,info

# 用户账号引导：默认关闭。开启时需同时提供系统管理员与初始总经理
# 两套账号各三个变量，共七个；真实初始密码只通过运行环境变量注入，
# 不写入本文件、.env.example 或日志。环境变量优先级高于本文件默认值。
USER_ADMIN_BOOTSTRAP_ENABLED: false
USER_ADMIN_BOOTSTRAP_USERNAME: ""
USER_ADMIN_BOOTSTRAP_PHONE: ""
USER_ADMIN_BOOTSTRAP_PASSWORD: ""
USER_MANAGER_BOOTSTRAP_USERNAME: ""
USER_MANAGER_BOOTSTRAP_PHONE: ""
USER_MANAGER_BOOTSTRAP_PASSWORD: ""

internal:
  scope:
    # 数据范围相关内部接口的共享密钥，与 order-service / product-service 保持一致。
    token: ${INTERNAL_SCOPE_TOKEN:internal_scope_token_dev_2026}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:9094}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:/home/user/.config/order-system/keys/jwt-public.pem}
    blacklist-key-prefix: ${JWT_BLACKLIST_KEY_PREFIX:auth:access-token:blacklist:}

