server:
  # 认证服务端口。
  port: 9094

# 启用 Sentinel 对 OpenFeign 的熔断降级适配，使 FeignClient 上配置的 FallbackFactory 生效。
feign:
  sentinel:
    enabled: true

spring:
  application:
    # 注册到 Nacos 的服务名称。
    name: auth-service

  cloud:
    nacos:
      discovery:
        # Nacos 服务地址。
        server-addr: 127.0.0.1:9097

        # Nacos 登录账号。
        username: nacos

        # Nacos 登录密码。
        password: root

  data:
    redis:
      # IDEA 本机启动时连接本机 Redis；Docker 启动时可通过 REDIS_HOST 改为 redis。
      host: ${REDIS_HOST:127.0.0.1}

      # Redis 默认端口。
      port: ${REDIS_PORT:9096}

      # Redis 密码，优先读取环境变量，冒号后为本机开发默认值。
      password: ${REDIS_PASSWORD:order_redis_dev_2026}

      # 当前开发环境使用 Redis 的 0 号逻辑库。
      database: 0

      # Redis 连接超时时间。
      connect-timeout: 2s

      # Redis 命令执行超时时间。
      timeout: 2s

security:
  captcha:
    # 图片验证码字符个数，取值范围 3-8。
    length: ${AUTH_CAPTCHA_LENGTH:4}

    # 验证码有效期，超时后需重新获取，Redis 键随 TTL 自动清理。
    ttl: ${AUTH_CAPTCHA_TTL:5m}

    # 验证码图片宽度与高度，单位为像素。
    width: ${AUTH_CAPTCHA_WIDTH:120}
    height: ${AUTH_CAPTCHA_HEIGHT:40}

    # 同一来源 IP 每分钟最多可获取的验证码数量，防止匿名接口被刷。
    max-per-minute: ${AUTH_CAPTCHA_MAX_PER_MINUTE:20}

  login-attempt:
    # 同一账号在失败窗口内允许的最大连续登录失败次数。
    max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}

    # 失败次数从第一次失败开始累计的固定时间窗口。
    failure-window: ${AUTH_LOGIN_FAILURE_WINDOW:15m}

    # 达到失败次数阈值后，账号临时锁定的时长。
    lock-duration: ${AUTH_LOGIN_LOCK_DURATION:15m}

  jwt:
    # JWT 签发方。
    issuer: "http://localhost:9094"

    # RSA 密钥编号。
    key-id: "order-system-rsa-key-2026"

    # RSA 私钥路径。
    private-key-location: "file:/home/user/.config/order-system/keys/jwt-private.pem"

    # RSA 公钥路径。
    public-key-location: "file:/home/user/.config/order-system/keys/jwt-public.pem"

    # Refresh Token 有效期，单位为秒，当前为 30 天。
    refresh-token-ttl-seconds: 2592000

    # Access Token 黑名单 Key 前缀，认证服务、Gateway 和业务服务必须保持一致。
    blacklist-key-prefix: "auth:access-token:blacklist:"

management:
  endpoints:
    web:
      # 暴露健康检查接口。
      exposure:
        include: health,info

# 接口文档：本地默认开启，生产环境可通过 SWAGGER_ENABLED=false 关闭。
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  service-title: 认证服务接口文档
  service-description: 登录、注册、刷新 Token 与注销接口。
  # 网关地址与路径前缀，用于修正经网关聚合后 "Try it out" 的目标地址。
  # 网关路由 StripPrefix=1 只剥离 /api 一段，故前缀固定为 /api，与各服务自身路径拼接。
  gateway-base-url: ${SWAGGER_GATEWAY_BASE_URL:http://localhost:9090}
  gateway-path: /api

internal:
  scope:
    token: ${INTERNAL_SCOPE_TOKEN:internal_scope_token_dev_2026}
