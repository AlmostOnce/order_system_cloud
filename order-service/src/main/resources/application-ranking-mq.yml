# 本地默认激活 ranking-mq；销量和订单通知共用已部署的 RocketMQ。
ranking:
  messaging:
    enabled: true
notification:
  order-events:
    enabled: ${NOTIFICATION_ORDER_EVENTS_ENABLED:true}
  cancel-tcc:
    enabled: ${NOTIFICATION_CANCEL_TCC_ENABLED:true}
spring:
  task:
    scheduling:
      pool:
        size: 2
  cloud:
    stream:
      output-bindings: salesPaid-out-0
      bindings:
        salesPaid-out-0:
          destination: order-paid-sales-v2
          content-type: application/json
          producer:
            error-channel-enabled: false
        orderNotification-out-0:
          destination: order-status-notification-v1
          content-type: application/json
          producer:
            error-channel-enabled: false
      rocketmq:
        binder:
          name-server: ${ROCKETMQ_NAMESERVER:127.0.0.1:9876}
        bindings:
          salesPaid-out-0:
            producer:
              group: order-sales-outbox-v1
              send-type: Sync
              send-msg-timeout: 3000
          orderNotification-out-0:
            producer:
              group: order-notification-outbox-v1
              send-type: Sync
              send-msg-timeout: 3000
