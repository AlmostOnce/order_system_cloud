feign:
  sentinel:
    # 开启 OpenFeign 的 Sentinel 支持。
    enabled: true

server:
  port: 9091

spring:
  profiles:
    # 本机已部署 RocketMQ；未显式指定 profile 时启用销量事件收发。
    default: ranking-mq
  data:
    redis:
      # IDEA 本机启动连接本机 Redis；容器启动时通过 REDIS_HOST 指向 redis 服务。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:9096}
      password: ${REDIS_PASSWORD:order_redis_dev_2026}
      database: 0
      connect-timeout: 2s
      timeout: 2s

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 本机开发容量：每个实例独立持有连接池，扩容时需合计 MySQL 连接数。
      initial-size: 1
      min-idle: 1
      max-active: 10
      max-wait: 3000
      validation-query: SELECT 1
      validation-query-timeout: 2
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
    url: jdbc:mysql://127.0.0.1:9095/order_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: order_user
    password: order_password_dev_2026
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: order-service

  cloud:
    sentinel:
      datasource:
        degrade:
          nacos:
            # Nacos API 地址。
            server-addr: 127.0.0.1:9097

            # Nacos 登录账号。
            username: nacos

            # Nacos 登录密码。
            password: root

            # Nacos 配置 Data ID。
            data-id: order-service-degrade-rules

            # Nacos 配置分组。
            group-id: SENTINEL_GROUP

            # 规则格式。
            data-type: json

            # 规则类型。
            rule-type: degrade
      enabled: true
      eager: true
      transport:
        # Sentinel Dashboard 地址。
        dashboard: 127.0.0.1:9099

        # 当前订单服务与 Dashboard 通信的端口。
        port: 9100
    openfeign:
      client:
        config:
          default:
            # 建立连接超时时间，单位：毫秒。
            connectTimeout: 2000

            # 等待远程服务响应超时时间，单位：毫秒。
            readTimeout: 3000

            # 开发环境记录基本调用日志。
            loggerLevel: basic
    nacos:
      discovery:
        server-addr: 127.0.0.1:9097
        username: nacos
        password: root

management:
  endpoints:
    web:
      exposure:
        include: health,info
security:
  jwt:
    issuer: http://localhost:9094
    public-key-location: file:/home/user/.config/order-system/keys/jwt-public.pem
    blacklist-key-prefix: "auth:access-token:blacklist:"

payment:
  internal:
    # 支付服务调用订单内部接口的共享密钥，与 payment-service 的 application.yml 保持一致。
    order-token: ${INTERNAL_ORDER_TOKEN:internal_order_token_dev_2026}

internal:
  scope:
    # 数据范围相关内部接口的共享密钥，与 user-service / product-service 保持一致。
    token: ${INTERNAL_SCOPE_TOKEN:internal_scope_token_dev_2026}

seata:
  # 下单扣库存使用 Seata AT 模式：order-service 既是全局事务发起者，也是订单库本地分支。
  enabled: true
  application-id: order-service
  # 由 Seata 自动代理数据源，本地分支才能写入 order_db.undo_log 支持全局回滚。
  enable-auto-data-source-proxy: true
  # 事务分组名必须与 stock-service（RM）一致，二者才能落到同一个 TC 集群。
  tx-service-group: ${SEATA_TX_SERVICE_GROUP:order-system-tx-group}
  service:
    # 事务分组到 TC 集群的映射，集群名与 seata-server 侧 cluster 配置一致。
    vgroup-mapping:
      order-system-tx-group: default
    # 本机开发直连 TC：TC 跑在 WSL 的 Docker 里，只能用容器内网 IP 注册到 Nacos，
    # 而 WSL2 NAT 下 Windows 宿主机没有到该网段的路由（流量还会被本机代理软件的 TUN
    # 接管成假连接），因此不做注册中心发现，直接使用 Docker 映射到宿主机的 9109 端口。
    # 容器化部署（服务与 seata-server 同处一个 Docker 网络）时，
    # 应改回 seata.registry.type=nacos 并补回 nacos 段，或把本项改写成容器内可达地址。
    grouplist:
      default: ${SEATA_TC_GROUPLIST:127.0.0.1:9109}
  registry:
    # file 表示地址来自本地配置（上面的 grouplist），不查注册中心。
    type: file
  config:
    # 客户端不引入配置中心，事务参数使用 starter 默认值。
    type: file

# 接口文档：本地默认开启，生产环境可通过 SWAGGER_ENABLED=false 关闭。
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  service-title: 订单服务接口文档
  service-description: 下单、订单查询与订单状态推进接口。
  # 网关地址与路径前缀，用于修正经网关聚合后 "Try it out" 的目标地址。
  # 网关路由 StripPrefix=1 只剥离 /api 一段，故前缀固定为 /api，与各服务自身路径拼接。
  gateway-base-url: ${SWAGGER_GATEWAY_BASE_URL:http://localhost:9090}
  gateway-path: /api
