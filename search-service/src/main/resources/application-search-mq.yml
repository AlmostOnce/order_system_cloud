spring:
  cloud:
    function:
      definition: productSearchRefresh
    stream:
      bindings:
        productSearchRefresh-in-0:
          destination: product-search-refresh-v1
          group: product-search-index-v1
          content-type: application/json
          error-handler-definition: productSearchRefreshRetryError
          consumer:
            max-attempts: 1
      rocketmq:
        binder:
          name-server: ${ROCKETMQ_NAMESERVER:127.0.0.1:9876}
        bindings:
          productSearchRefresh-in-0:
            consumer:
              consume-from-where: CONSUME_FROM_FIRST_OFFSET
              push:
                orderly: false
                max-reconsume-times: 16
